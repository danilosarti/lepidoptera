<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Left upper wing -->
  <path d="M 47 36
           C 36 22 14 14 8 26
           C 2 40 14 56 41 57"
        fill="#8dd4ce" stroke="#5aaeaa" stroke-width="1"/>
  <!-- Right upper wing -->
  <path d="M 53 36
           C 64 22 86 14 92 26
           C 98 40 86 56 59 57"
        fill="#8dd4ce" stroke="#5aaeaa" stroke-width="1"/>

  <!-- Left lower wing -->
  <path d="M 43 56
           C 22 62 10 73 14 82
           C 18 88 30 82 34 72"
        fill="#70bcb8" stroke="#5aaeaa" stroke-width="1"/>
  <!-- Left tail -->
  <path d="M 34 72
           C 32 78 26 86 22 94"
        fill="none" stroke="#5aaeaa" stroke-width="3.5"
        stroke-linecap="round"/>
  <path d="M 34 72
           C 32 78 26 86 22 94"
        fill="none" stroke="#8dd4ce" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Right lower wing -->
  <path d="M 57 56
           C 78 62 90 73 86 82
           C 82 88 70 82 66 72"
        fill="#70bcb8" stroke="#5aaeaa" stroke-width="1"/>
  <!-- Right tail -->
  <path d="M 66 72
           C 68 78 74 86 78 94"
        fill="none" stroke="#5aaeaa" stroke-width="3.5"
        stroke-linecap="round"/>
  <path d="M 66 72
           C 68 78 74 86 78 94"
        fill="none" stroke="#8dd4ce" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Wing vein highlights (subtle) -->
  <path d="M 47 36 C 32 40 18 46 14 56"
        fill="none" stroke="#5aaeaa" stroke-width=".5" opacity=".4"/>
  <path d="M 53 36 C 68 40 82 46 86 56"
        fill="none" stroke="#5aaeaa" stroke-width=".5" opacity=".4"/>

  <!-- Cream spots (upper wings) -->
  <ellipse cx="24" cy="36" rx="6" ry="4"
           fill="#f2e4b0" opacity=".88"
           transform="rotate(-14 24 36)"/>
  <ellipse cx="76" cy="36" rx="6" ry="4"
           fill="#f2e4b0" opacity=".88"
           transform="rotate(14 76 36)"/>
  <!-- Smaller spots (lower wings) -->
  <ellipse cx="22" cy="68" rx="3.5" ry="2.5"
           fill="#f2e4b0" opacity=".75"
           transform="rotate(-5 22 68)"/>
  <ellipse cx="78" cy="68" rx="3.5" ry="2.5"
           fill="#f2e4b0" opacity=".75"
           transform="rotate(5 78 68)"/>

  <!-- Body (thorax + abdomen) -->
  <ellipse cx="50" cy="50" rx="5.5" ry="19" fill="#8b6340"/>
  <!-- Body texture lines -->
  <line x1="50" y1="36" x2="50" y2="64"
        stroke="#a07848" stroke-width=".7" opacity=".4"/>

  <!-- Head -->
  <ellipse cx="50" cy="31" rx="5" ry="4" fill="#a07848"/>

  <!-- Antennae left -->
  <path d="M 46 28 C 40 20 33 13 26 8"
        stroke="#7a5030" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="8" r="2" fill="#7a5030"/>
  <!-- Antennae right -->
  <path d="M 54 28 C 60 20 67 13 74 8"
        stroke="#7a5030" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="74" cy="8" r="2" fill="#7a5030"/>
</svg>
