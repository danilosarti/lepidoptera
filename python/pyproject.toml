[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lepidoptera"
version = "0.1.0"
description = "Domain-agnostic causal simulation engine with mixed variable types, vine copula dependence, and individual-level counterfactual propagation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Danilo A. Sarti", email = "danilosarti@rcsi.ie" },
]
keywords = [
    "causal inference",
    "structural causal model",
    "DAG",
    "simulation",
    "counterfactual",
    "vine copula",
    "synthetic data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
copula = ["pyvinecopulib>=0.6"]
graph  = ["networkx>=3.0"]
plot   = ["matplotlib>=3.7", "networkx>=3.0"]
all    = ["pyvinecopulib>=0.6", "networkx>=3.0", "matplotlib>=3.7"]
dev    = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage      = "https://github.com/daniloasarti/lepidoptera"
Documentation = "https://github.com/daniloasarti/lepidoptera"
Repository    = "https://github.com/daniloasarti/lepidoptera"
"Bug Tracker" = "https://github.com/daniloasarti/lepidoptera/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lepidoptera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
